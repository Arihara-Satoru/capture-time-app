name: Release Android APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="capture-time-app-${GITHUB_REF_NAME}-unsigned.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          gh release create "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256" --title "$GITHUB_REF_NAME" --generate-notes

